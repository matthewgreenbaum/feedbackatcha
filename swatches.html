<!DOCTYPE html>
<html><head><style>
body{font-family:-apple-system,sans-serif;padding:40px;background:#F5F3EF;display:flex;flex-direction:column;gap:20px}
h2{margin:0 0 10px;font-size:1.1rem;color:#333}
.row{display:flex;gap:16px;flex-wrap:wrap}
.swatch{width:160px;height:120px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:0.75rem;font-weight:600;color:#555;cursor:pointer;border:2px solid transparent;transition:0.2s}
.swatch:hover{border-color:#6B3FA0;transform:scale(1.03)}
.swatch span{background:rgba(255,255,255,0.7);padding:4px 8px;border-radius:6px;font-size:0.7rem}
.card{width:160px;height:60px;background:white;border-radius:8px;margin-top:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.current{border:2px solid #999}
</style></head><body>
<h2>Current background</h2>
<div class="row">
  <div class="swatch current" style="background:#F5F3EF"><span>#F5F3EF — Current (beige)</span><div class="card"></div></div>
</div>
<h2>Muted eggshell blues — lighter</h2>
<div class="row">
  <div class="swatch" style="background:#EDF1F5"><span>#EDF1F5</span><div class="card"></div></div>
  <div class="swatch" style="background:#E8ECF2"><span>#E8ECF2</span><div class="card"></div></div>
  <div class="swatch" style="background:#E4EAF0"><span>#E4EAF0</span><div class="card"></div></div>
  <div class="swatch" style="background:#E9EDF3"><span>#E9EDF3</span><div class="card"></div></div>
</div>
<h2>Muted eggshell blues — mid</h2>
<div class="row">
  <div class="swatch" style="background:#E0E7EE"><span>#E0E7EE</span><div class="card"></div></div>
  <div class="swatch" style="background:#DCE3EC"><span>#DCE3EC</span><div class="card"></div></div>
  <div class="swatch" style="background:#DFE4ED"><span>#DFE4ED</span><div class="card"></div></div>
  <div class="swatch" style="background:#D9E1EB"><span>#D9E1EB</span><div class="card"></div></div>
</div>
<h2>Muted eggshell blues — darker</h2>
<div class="row">
  <div class="swatch" style="background:#D4DCE6"><span>#D4DCE6</span><div class="card"></div></div>
  <div class="swatch" style="background:#D0D8E4"><span>#D0D8E4</span><div class="card"></div></div>
  <div class="swatch" style="background:#CDD6E2"><span>#CDD6E2</span><div class="card"></div></div>
  <div class="swatch" style="background:#C8D2E0"><span>#C8D2E0</span><div class="card"></div></div>
</div>
<h2>Blue-gray with slight warmth</h2>
<div class="row">
  <div class="swatch" style="background:#E3E7ED"><span>#E3E7ED</span><div class="card"></div></div>
  <div class="swatch" style="background:#DEE3EA"><span>#DEE3EA</span><div class="card"></div></div>
  <div class="swatch" style="background:#D8DFE8"><span>#D8DFE8</span><div class="card"></div></div>
  <div class="swatch" style="background:#E1E6EE"><span>#E1E6EE</span><div class="card"></div></div>
</div>
</body></html>
